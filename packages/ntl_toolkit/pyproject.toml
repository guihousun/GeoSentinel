[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ntl-toolkit"
version = "0.1.0"
description = "Shared GIS and nighttime-light execution core for NTL-GPT and MCP clients"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mcp>=1.9,<2",
    "pydantic>=2.7,<3",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "geopandas>=0.14,<2",
    "rasterio>=1.3,<2",
    "shapely>=2,<3",
    "pyproj>=3.6,<4",
    "scipy>=1.11,<2",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
ntl-gis-core = "ntl_toolkit.adapters.mcp.gis_core:main"
ntl-download = "ntl_toolkit.adapters.mcp.download:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"ntl_toolkit.adapters.mcp" = ["gis_capabilities.json", "download_capabilities.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
